<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer glow -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d8a50" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2d8a50" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a5c35"/>
      <stop offset="50%" stop-color="#2d8a50"/>
      <stop offset="100%" stop-color="#1a5c35"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#ede5d0"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f3d22"/>
      <stop offset="50%" stop-color="#1a5c35"/>
      <stop offset="100%" stop-color="#0f3d22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d060"/>
      <stop offset="50%" stop-color="#c8960c"/>
      <stop offset="100%" stop-color="#f5d060"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background glow -->
  <circle cx="50" cy="52" r="46" fill="url(#glow)"/>

  <!-- Book shadow -->
  <ellipse cx="50" cy="85" rx="30" ry="5" fill="#000" opacity="0.15"/>

  <!-- ═══ BOOK BODY ═══ -->
  <!-- Left cover -->
  <rect x="8" y="20" width="36" height="58" rx="3" fill="url(#coverGrad)" filter="url(#shadow)"/>
  <!-- Right cover -->
  <rect x="56" y="20" width="36" height="58" rx="3" fill="url(#coverGrad)" filter="url(#shadow)"/>
  <!-- Spine -->
  <rect x="44" y="20" width="12" height="58" rx="1" fill="url(#spineGrad)"/>

  <!-- Left page inside -->
  <rect x="10" y="22" width="32" height="54" rx="2" fill="url(#pageGrad)"/>
  <!-- Right page inside -->
  <rect x="58" y="22" width="32" height="54" rx="2" fill="url(#pageGrad)"/>

  <!-- ═══ LEFT COVER DECORATION ═══ -->
  <!-- Outer border -->
  <rect x="11" y="23" width="30" height="52" rx="1.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <!-- Inner border -->
  <rect x="13" y="25" width="26" height="48" rx="1" fill="none" stroke="url(#goldGrad)" stroke-width="0.5"/>
  <!-- Center diamond ornament -->
  <path d="M26 41 L30 49 L26 57 L22 49 Z" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <circle cx="26" cy="49" r="2.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.7"/>
  <circle cx="26" cy="49" r="1" fill="url(#goldGrad)"/>
  <!-- Corner ornaments left -->
  <circle cx="15" cy="27" r="1.2" fill="url(#goldGrad)"/>
  <circle cx="37" cy="27" r="1.2" fill="url(#goldGrad)"/>
  <circle cx="15" cy="71" r="1.2" fill="url(#goldGrad)"/>
  <circle cx="37" cy="71" r="1.2" fill="url(#goldGrad)"/>
  <!-- Horizontal lines decoration -->
  <line x1="14" y1="34" x2="38" y2="34" stroke="url(#goldGrad)" stroke-width="0.4" opacity="0.7"/>
  <line x1="14" y1="64" x2="38" y2="64" stroke="url(#goldGrad)" stroke-width="0.4" opacity="0.7"/>

  <!-- ═══ RIGHT COVER DECORATION ═══ -->
  <rect x="61" y="23" width="30" height="52" rx="1.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <rect x="63" y="25" width="26" height="48" rx="1" fill="none" stroke="url(#goldGrad)" stroke-width="0.5"/>
  <path d="M76 41 L80 49 L76 57 L72 49 Z" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <circle cx="76" cy="49" r="2.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.7"/>
  <circle cx="76" cy="49" r="1" fill="url(#goldGrad)"/>
  <circle cx="65" cy="27" r="1.2" fill="url(#goldGrad)"/>
  <circle cx="87" cy="27" r="1.2" fill="url(#goldGrad)"/>
  <circle cx="65" cy="71" r="1.2" fill="url(#goldGrad)"/>
  <circle cx="87" cy="71" r="1.2" fill="url(#goldGrad)"/>
  <line x1="64" y1="34" x2="88" y2="34" stroke="url(#goldGrad)" stroke-width="0.4" opacity="0.7"/>
  <line x1="64" y1="64" x2="88" y2="64" stroke="url(#goldGrad)" stroke-width="0.4" opacity="0.7"/>

  <!-- ═══ SPINE DECORATION ═══ -->
  <line x1="50" y1="24" x2="50" y2="76" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.8"/>
  <circle cx="50" cy="49" r="2" fill="url(#goldGrad)" opacity="0.9"/>
  <circle cx="50" cy="32" r="1" fill="url(#goldGrad)" opacity="0.7"/>
  <circle cx="50" cy="66" r="1" fill="url(#goldGrad)" opacity="0.7"/>

  <!-- ═══ PAGE LINES (text simulation) ═══ -->
  <!-- Left page lines -->
  <line x1="14" y1="33" x2="38" y2="33" stroke="#8b7355" stroke-width="0.5" opacity="0.4"/>
  <line x1="14" y1="37" x2="38" y2="37" stroke="#8b7355" stroke-width="0.5" opacity="0.4"/>
  <line x1="14" y1="41" x2="38" y2="41" stroke="#8b7355" stroke-width="0.5" opacity="0.4"/>
  <line x1="14" y1="45" x2="38" y2="45" stroke="#8b7355" stroke-width="0.5" opacity="0.4"/>
  <line x1="14" y1="49" x2="38" y2="49" stroke="#8b7355" stroke-width="0.5" opacity="0.4"/>
  <line x1="14" y1="53" x2="38" y2="53" stroke="#8b7355" stroke-width="0.5" opacity="0.4"/>
  <line x1="14" y1="57" x2="38" y2="57" stroke="#8b7355" stroke-width="0.5" opacity="0.4"/>
  <line x1="14" y1="61" x2="38" y2="61" stroke="#8b7355" stroke-width="0.5" opacity="0.4"/>
  <line x1="14" y1="65" x2="38" y2="65" stroke="#8b7355" stroke-width="0.5" opacity="0.4"/>
  <!-- Right page lines -->
  <line x1="62" y1="33" x2="86" y2="33" stroke="#8b7355" stroke-width="0.5" opacity="0.4"/>
  <line x1="62" y1="37" x2="86" y2="37" stroke="#8b7355" stroke-width="0.5" opacity="0.4"/>
  <line x1="62" y1="41" x2="86" y2="41" stroke="#8b7355" stroke-width="0.5" opacity="0.4"/>
  <line x1="62" y1="45" x2="86" y2="45" stroke="#8b7355" stroke-width="0.5" opacity="0.4"/>
  <line x1="62" y1="49" x2="86" y2="49" stroke="#8b7355" stroke-width="0.5" opacity="0.4"/>
  <line x1="62" y1="53" x2="86" y2="53" stroke="#8b7355" stroke-width="0.5" opacity="0.4"/>
  <line x1="62" y1="57" x2="86" y2="57" stroke="#8b7355" stroke-width="0.5" opacity="0.4"/>
  <line x1="62" y1="61" x2="86" y2="61" stroke="#8b7355" stroke-width="0.5" opacity="0.4"/>
  <line x1="62" y1="65" x2="86" y2="65" stroke="#8b7355" stroke-width="0.5" opacity="0.4"/>

  <!-- ═══ TOP DECORATION — Crescent & Star ═══ -->
  <!-- Crescent moon -->
  <circle cx="50" cy="10" r="6" fill="url(#goldGrad)" opacity="0.95"/>
  <circle cx="53" cy="8.5" r="4.5" fill="#1a3a5c" opacity="0.0"/>
  <!-- Star of Rub el Hizb (Islamic 8-point star) -->
  <g transform="translate(50,10)">
    <polygon points="0,-5 1.2,-1.2 5,0 1.2,1.2 0,5 -1.2,1.2 -5,0 -1.2,-1.2"
             fill="url(#goldGrad)" opacity="0.9"/>
    <circle cx="0" cy="0" r="1.5" fill="#1a5c35"/>
  </g>

  <!-- ═══ BISMILLAH arc text area ═══ -->
  <path d="M20 80 Q50 87 80 80" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.5"/>
</svg>
